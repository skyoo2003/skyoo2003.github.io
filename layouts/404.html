{{- define "main" }}
{{ partial "sidebar.html" (dict "context" . "disableSidebar" true) }}
<main id="content" class="devlog-home">
  <header class="devlog-intro">
    <h1>404</h1>
    <div class="content"><p>{{ if eq .Language.Lang "ko" }}페이지를 찾을 수 없습니다.{{ else }}Page not found.{{ end }}</p></div>
    <a href="{{ "posts/" | relLangURL }}">{{ if eq .Language.Lang "ko" }}전체 글 보기{{ else }}Browse all posts{{ end }} →</a>
  </header>
</main>
<script src="/js/404-redirect.js"></script>
{{- end }}
