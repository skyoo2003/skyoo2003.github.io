<h{{ .Level }} id="{{ .Anchor }}" data-hextra-search-id="{{ .Anchor }}"{{ with .Attributes.class }} class="{{ . }}"{{ end }}>
  {{- .Text | safeHTML -}}
  {{- if gt .Level 1 -}}
    <a href="#{{ .Anchor }}" class="subheading-anchor" aria-label="{{ (T "permalinkLabel") | default "Permalink for this section" }}"></a>
  {{- end -}}
</h{{ .Level }}>
