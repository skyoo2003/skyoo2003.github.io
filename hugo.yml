baseURL: "https://skyoo2003.github.io/"
title: "Devlog in the SKY"
theme: hextra

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
minify:
  disableXML: true
  minifyOutput: true
defaultContentLanguage: ko
defaultContentLanguageInSubdir: true
languages:
  ko:
    languageName: "한국어"
    weight: 1
    title: "Devlog in the SKY"
    menu:
      main:
        - name: "홈"
          pageRef: /
          weight: 1
        - name: "글"
          pageRef: /posts
          weight: 2
        - name: "태그"
          pageRef: /tags
          weight: 3
        - name: "검색"
          weight: 4
          params:
            type: search
        - name: "소개"
          pageRef: /about
          weight: 5
  en:
    languageName: "English"
    weight: 2
    title: "Devlog in the SKY"
    menu:
      main:
        - name: Home
          pageRef: /
          weight: 1
        - name: Posts
          pageRef: /posts
          weight: 2
        - name: Tags
          pageRef: /tags
          weight: 3
        - name: Search
          weight: 4
          params:
            type: search
        - name: About
          pageRef: /about
          weight: 5
params:
  description: "Devlog in the SKY - Yet another developer's blog"
  author:
    name: "Sung-Kyu Yoo"
    email: "skyoo2003@gmail.com"
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: system
    displayToggle: true
  page:
    width: wide
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
  blog:
    list:
      displayTags: true
      sortBy: date
      sortOrder: desc
      pagerSize: 10
    article:
      displayPagination: true
  toc:
    displayTags: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
  highlight:
    copy:
      enable: true
      display: always
  comments:
    enable: false
services:
  googleAnalytics:
    id: G-YVJGV6NPZX
outputs:
  home:
    - HTML
    - RSS
taxonomies:
  tag: tags
  category: categories
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    noClasses: false
    style: github
